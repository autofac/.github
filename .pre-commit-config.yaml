repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: "5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0"  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        args:
          - --fix
        # GitHub injects this into the PR description, so it's a fragment
        # rather than a document and deliberately has no top-level heading.
        exclude: ^PULL_REQUEST_TEMPLATE/
